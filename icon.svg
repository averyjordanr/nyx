<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Nyx Research Notebook</title>
  <defs>
    <!-- the field: a deep notebook surface, lifted slightly behind the disc -->
    <radialGradient id="field" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#1B2233"/>
      <stop offset="62%" stop-color="#121828"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <!-- the corona: accent light bleeding out from behind the occulted disc -->
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#79B1CD" stop-opacity="0"/>
      <stop offset="66%" stop-color="#79B1CD" stop-opacity=".40"/>
      <stop offset="80%" stop-color="#79B1CD" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#79B1CD" stop-opacity="0"/>
    </radialGradient>
    <!-- atmosphere above the apex: light gathers where the crescent is brightest -->
    <radialGradient id="apex" gradientUnits="userSpaceOnUse" cx="256" cy="92" r="148">
      <stop offset="0%" stop-color="#8FC4DD" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#8FC4DD" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#8FC4DD" stop-opacity="0"/>
    </radialGradient>
    <!-- the crescent itself: brightest at the apex, cooling toward the horns -->
    <linearGradient id="limb" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4E8CAC"/>
      <stop offset="46%" stop-color="#8FC4DD"/>
      <stop offset="100%" stop-color="#DCEEF7"/>
    </linearGradient>
    <!-- the horizon: the entry page's line, carried into the mark -->
    <linearGradient id="hor" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="464" y2="0">
      <stop offset="0" stop-color="#6FA7C4" stop-opacity="0"/>
      <stop offset=".24" stop-color="#6FA7C4" stop-opacity=".26"/>
      <stop offset=".76" stop-color="#6FA7C4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6FA7C4" stop-opacity="0"/>
    </linearGradient>
    <!-- the occulting disc is not flat black; it holds a trace of the field -->
    <radialGradient id="occult" cx="50%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#0E1320"/>
      <stop offset="100%" stop-color="#080B13"/>
    </radialGradient>
    <!-- cut the dark body out of the lit body; what is left is the crescent -->
    <mask id="lune">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="252" r="168" fill="white"/>
      <circle cx="256" cy="296" r="152" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#field)"/>
  <!-- a sparse field of stars; whispers at 128px, gone below that -->
  <g fill="#DCEEF7">
    <circle cx="104" cy="96"  r="1.6" fill-opacity=".22"/>
    <circle cx="400" cy="74"  r="2.2" fill-opacity=".30"/>
    <circle cx="438" cy="182" r="1.3" fill-opacity=".16"/>
    <circle cx="76"  cy="220" r="1.2" fill-opacity=".14"/>
    <circle cx="148" cy="434" r="1.4" fill-opacity=".16"/>
    <circle cx="394" cy="422" r="1.8" fill-opacity=".20"/>
  </g>
  <circle cx="256" cy="256" r="252" fill="url(#corona)"/>
  <circle cx="256" cy="92" r="148" fill="url(#apex)"/>
  <!-- the horizon passes behind the body -->
  <line x1="48" y1="340" x2="464" y2="340" stroke="url(#hor)" stroke-width="2"/>
  <circle cx="256" cy="252" r="168" fill="url(#limb)" mask="url(#lune)"/>
  <circle cx="256" cy="296" r="152" fill="url(#occult)"/>
  <!-- the faintest rim on the dark body, so it reads as an object and not a hole -->
  <circle cx="256" cy="296" r="152" fill="none" stroke="#79B1CD" stroke-opacity=".16" stroke-width="1.5"/>
  <!-- a whisper of an edge, so the tile holds its shape on a dark dock -->
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="2"/>
</svg>
